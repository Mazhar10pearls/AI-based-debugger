name: AI-Based Debugger Pipeline

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

on:
  workflow_run:
    workflows:
      - Local CI/CD Deploy
    types:
      - completed

# ── Serialize per branch ────────────────────────────────────────────────────
# Inference is remote now, so there is no 8GB-box OOM risk and no reason to
# serialize globally. What we DO still want is one auto-fix per branch at a
# time, so two failures on the same branch can't race and open duplicate fix
# PRs. cancel-in-progress stays false: a fix mid-flight is never killed.
concurrency:
  group: auto-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-fix:
    # Run only if CI failed AND the failing commit was NOT the bot (loop guard).
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_commit.author.name != 'github-actions[bot]'

    name: Auto-Fix Failed Workflow
    runs-on: [self-hosted, docker, ci]
    environment: prod
    # 15-min budget (was 30 — local inference was the bulk of the old estimate):
    #   ~2 min  checkout + pip + git setup + log download
    #   ~1 min  evidence collection + deterministic seed retrieval
    #   ~2 min  OpenAI investigation (up to 4 turns) + patch + review
    #   ~2 min  validate + write + git + PR
    #   ─────────────────────────────────────────────
    #   ~7 min expected | 15 min hard ceiling
    # The script enforces its own TOTAL_TIME_BUDGET (default 600s) inside this.
    timeout-minutes: 15

    steps:
      # ── Resolve the branch that actually failed (branch-aware git flow) ───
      # The fix must branch off, and PR back to, the SAME branch the failure
      # happened on — not a hardcoded 'develop'. A main failure → fix PR to
      # main; a develop failure → fix PR to develop.
      - name: Resolve originating branch
        id: src
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          if [ -z "$BRANCH" ]; then
            echo "No head_branch on the event — cannot proceed."
            exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Originating (failed) branch: $BRANCH"

      - name: Checkout originating branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.src.outputs.branch }}
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml --quiet

      - name: Validate required secrets
        run: |
          : "${OPENAI_API_KEY:?Secret OPENAI_API_KEY is not set}"
          : "${GH_PAT:?Secret GH_PAT is not set}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_PAT:         ${{ secrets.GH_PAT }}

      # ── Download failed workflow logs (race-proof) ───────────────────────
      # A fast, early failure (e.g. a bad setup-python version) finishes in
      # seconds — the workflow_run event fires BEFORE GitHub finishes archiving
      # the run logs, so /logs returns an empty/not-ready zip and failure.log
      # comes out empty. Fix: retry the run-logs endpoint with backoff, then fall
      # back to fetching each FAILED job's logs directly (plain text, reliable
      # even for very-early failures).
      - name: Download failed workflow logs
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, requests, zipfile, sys, time, io

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as f:
              event = json.load(f)

          run_id    = event['workflow_run']['id']
          repo_full = event['repository']['full_name']
          headers   = {'Authorization': f"Bearer {os.environ['GH_PAT']}",
                       'Accept': 'application/vnd.github+json'}

          def zip_to_text(content):
              try:
                  zf = zipfile.ZipFile(io.BytesIO(content))
              except zipfile.BadZipFile:
                  return ''
              parts = []
              for name in sorted(zf.namelist()):
                  if name.endswith('.txt'):
                      parts.append(f'=== {name} ===\n'
                                   + zf.read(name).decode('utf-8', 'replace'))
              return '\n\n'.join(parts)

          # 1. Run-logs endpoint, retried until the archive is actually populated.
          text = ''
          for attempt in range(1, 8):
              r = requests.get(
                  f'https://api.github.com/repos/{repo_full}/actions/runs/{run_id}/logs',
                  headers=headers, timeout=120)
              if r.status_code == 200:
                  text = zip_to_text(r.content)
                  if text.strip():
                      print(f'Run logs ready on attempt {attempt} ({len(text)} chars)')
                      break
              print(f'Attempt {attempt}: logs not ready '
                    f'(HTTP {r.status_code}, {len(text)} chars) — waiting 10s...')
              time.sleep(10)

          # 2. Fallback: pull each FAILED job's logs directly. The jobs endpoint
          #    returns plain text and is reliable even for very-early failures.
          if not text.strip():
              jr = requests.get(
                  f'https://api.github.com/repos/{repo_full}/actions/runs/{run_id}/jobs',
                  headers=headers, timeout=60)
              if jr.status_code == 200:
                  chunks = []
                  for job in jr.json().get('jobs', []):
                      if job.get('conclusion') == 'failure':
                          lr = requests.get(
                              f"https://api.github.com/repos/{repo_full}/actions/jobs/{job['id']}/logs",
                              headers=headers, timeout=60)
                          if lr.status_code == 200 and lr.text.strip():
                              chunks.append(f"=== job: {job.get('name')} ===\n{lr.text}")
                  text = '\n\n'.join(chunks)
                  if text.strip():
                      print(f'Recovered {len(text)} chars from failed-job logs')

          pathlib.Path('failure.log').write_text(text, encoding='utf-8')
          print(f'Generated failure.log ({len(text)} bytes)')
          if not text.strip():
              print('WARNING: no logs retrievable for this run', file=sys.stderr)
          PY

      - name: Check failure log is non-empty
        run: |
          if [ ! -s failure.log ]; then
            echo "failure.log is empty — nothing to fix."
            exit 1
          fi

      - name: Configure git with PAT remote
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git"

      # ── Smoke-test: OpenAI reachable + key valid before spending time ─────
      # This is the step that catches the MTU/PMTUD class of problem on this
      # self-hosted box: a TLS connection that opens and then stalls mid-body.
      # --max-time makes that show up here as a hard failure instead of as a
      # confusing read-timeout inside the fixer. The script's own
      # preflight_openai() re-checks strict-schema support separately.
      - name: Verify OpenAI API is reachable
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
        run: |
          echo "Checking OpenAI at: $OPENAI_BASE_URL"
          HTTP_CODE=$(curl -s -o /tmp/openai_probe.json -w "%{http_code}" \
            --max-time 20 \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            "$OPENAI_BASE_URL/models" || echo "000")
          case "$HTTP_CODE" in
            200)
              echo "✓ OpenAI responded (HTTP 200), $(wc -c < /tmp/openai_probe.json) bytes"
              ;;
            401|403)
              echo "❌ OpenAI rejected the key (HTTP $HTTP_CODE) — check the OPENAI_API_KEY secret"
              exit 1
              ;;
            000)
              echo "❌ No response — DNS, egress firewall, proxy, or MTU/PMTUD stall"
              exit 1
              ;;
            *)
              echo "❌ Unexpected HTTP $HTTP_CODE — aborting to save budget"
              exit 1
              ;;
          esac
          rm -f /tmp/openai_probe.json

      - name: Run auto-fixer
        env:
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL:    ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          # Investigation reasons; patch/review are mechanical. Override these
          # as repository VARIABLES (not secrets) to A/B a model without a code change.
          INVESTIGATE_MODEL:  ${{ vars.INVESTIGATE_MODEL || 'gpt-4.1' }}
          PATCH_MODEL:        ${{ vars.PATCH_MODEL       || 'gpt-4.1-mini' }}
          REVIEW_MODEL:       ${{ vars.REVIEW_MODEL      || 'gpt-4.1-mini' }}
          GITHUB_TOKEN:       ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          GITHUB_SERVER_URL:  ${{ github.server_url }}
          # Branch-aware: base AND target are the branch that failed.
          GIT_BASE_BRANCH:    ${{ steps.src.outputs.branch }}
          GIT_TARGET_BRANCH:  ${{ steps.src.outputs.branch }}
        run: |
          echo "Models → investigate=$INVESTIGATE_MODEL patch=$PATCH_MODEL review=$REVIEW_MODEL"
          echo "Git flow → fix/* off '$GIT_BASE_BRANCH', PR targets '$GIT_TARGET_BRANCH'"
          python3 auto-fixer.py --input failure.log --skip-tests

      # ── If the fixer could not fix it → open an Issue ─────────────────────
      # The script opens its own, richer issue for in-band failures (low
      # confidence, no usable patch, tests still failing). This is the
      # out-of-band net for the cases it can't report on itself: the job was
      # killed, the runner died, or it exited before reaching an escalation path.
      - name: Open issue if fixer failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh issue create \
            --title "🚨 Auto-fixer could not fix CI failure on '${{ steps.src.outputs.branch }}' — manual review" \
            --body "The auto-fixer ran but could not produce a valid patch.

          **Failed branch:** \`${{ steps.src.outputs.branch }}\`
          **Failed run:** ${{ github.event.workflow_run.html_url }}

          **Git flow reminder:**
          - Fix manually on the branch above.
          - Promote via: develop → release/* → main (+ tag) after QA." \
            --label "bug" || true