name: Local CI/CD Deploy

# ── Git flow ────────────────────────────────────────────────────────────────
# build + test → every push/PR to main, develop, qa/**
# deploy        → push to main OR develop (same container, same :5000)
#
# Note: since both branches deploy to the same container/port, whichever one
# pushes LAST wins — a develop push after a main push will overwrite what's
# running, and vice versa. Fine for a single-box "test the latest build" setup.
on:
  push:
    branches: [main, develop, 'qa/**']
  pull_request:
    branches: [main, develop, 'qa/**']
  workflow_dispatch:

concurrency:
  group: local-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-deploy:
    name: Build, Test, and Deploy
    runs-on: self-hosted

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Python ───────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sample_app/requirements.txt

      # ── Test (always) ────────────────────────────────────────────────────
      - name: Run unit tests
        run: pytest sample_app/test_app.py

      # ── Build (always) ──────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f sample_app/Dockerfile \
            -t ai-devops-sample-app:${{ github.sha }} \
            -t ai-devops-sample-app:latest \
            --load \
            sample_app

      # ── Smoke test (always) ────────────────────────────────────────────────
      # Runs the freshly built image on a RANDOM host port so it can never
      # collide with the deployed :5000 container or a parallel run. Always
      # tears down (even on failure) so nothing leaks to the next run.
      - name: Smoke-test the image
        env:
          IMAGE: ai-devops-sample-app:${{ github.sha }}
          CONTAINER_PORT: "5000"   # port the app listens on INSIDE the container
          HEALTH_PATH: "/"         # endpoint that returns 2xx when healthy
          MAX_WAIT: "45"           # seconds before giving up
        run: |
          set -euo pipefail
          SMOKE="smoke-${{ github.sha }}"

          # clear this run's own leftover, plus any DEAD smoke containers.
          # only exited ones — never touch a running container from a parallel run.
          docker rm -f "$SMOKE" >/dev/null 2>&1 || true
          docker ps -aq --filter "name=^smoke-" --filter "status=exited" \
            | xargs -r docker rm -f >/dev/null 2>&1 || true

          # guarantee teardown even if any command below fails
          cleanup() { docker rm -f "$SMOKE" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          # random host port (-p 0:) => no collision with the deployed :5000 app
          docker run -d --name "$SMOKE" -p "0:${CONTAINER_PORT}" "$IMAGE" >/dev/null

          HOSTPORT="$(docker port "$SMOKE" "${CONTAINER_PORT}/tcp" | head -n1 | sed 's/.*://')"
          if [ -z "${HOSTPORT:-}" ]; then
            echo "Could not resolve mapped host port"; docker logs "$SMOKE" || true; exit 1
          fi
          URL="http://127.0.0.1:${HOSTPORT}${HEALTH_PATH}"
          echo "Smoke: $SMOKE -> ${URL} (up to ${MAX_WAIT}s)"

          deadline=$(( $(date +%s) + MAX_WAIT ))
          while :; do
            # container died? fail fast with exit code + logs
            if [ "$(docker inspect -f '{{.State.Running}}' "$SMOKE" 2>/dev/null)" != "true" ]; then
              code="$(docker inspect -f '{{.State.ExitCode}}' "$SMOKE" 2>/dev/null || echo '?')"
              echo "Container exited early (exit=${code}) — runtime/CMD error"
              echo "----- logs -----"; docker logs "$SMOKE" 2>&1 | tail -n 50 || true
              exit 1
            fi
            if curl -fsS --max-time 3 "$URL" >/dev/null 2>&1; then
              echo "Smoke test PASSED"; exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out after ${MAX_WAIT}s waiting for ${URL}"
              echo "----- logs -----"; docker logs "$SMOKE" 2>&1 | tail -n 50 || true
              exit 1
            fi
            sleep 2
          done

      # ── Deploy (main OR develop, push only) ────────────────────────────────
      - name: Stop existing container
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
        run: docker rm -f ai-devops-sample-app || true

      - name: Start container
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
        run: |
          docker run -d \
            --name ai-devops-sample-app \
            -p 5000:5000 \
            ai-devops-sample-app:${{ github.sha }}

      - name: Wait for app to be healthy
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
        run: |
          echo "Waiting for application to start..."
          for i in {1..20}; do
            if curl -fs http://127.0.0.1:5000 > /dev/null; then
              echo "Application is healthy!"
              exit 0
            fi
            echo "Not ready yet... retrying ($i/20)"
            sleep 3
          done
          echo "Application failed health check"
          docker logs ai-devops-sample-app
          exit 1

      - name: Verify deployment
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
        run: curl -f http://127.0.0.1:5000

      # ── Housekeeping ─────────────────────────────────────────────────────
      - name: Prune dangling images
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
        run: docker image prune -f || true