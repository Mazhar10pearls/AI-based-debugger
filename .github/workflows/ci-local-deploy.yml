name: Local CI/CD Deploy

# ── Git flow ────────────────────────────────────────────────────────────────
# build + test  → runs on every push/PR to main, develop & qa/** branches
# deploy        → ONLY on push to develop
#
#   feature/* ──PR──► develop ──► release/* ──► main
#                       │            │            └─ build+test only
#                       │            └ build+test (no deploy)
#                       └ build+test + DEPLOY
#
# Smoke test uses host port 5001.
# Actual application uses host port 5000.
#
# This allows the new image to be tested without stopping the
# currently running application.

on:
  push:
    branches: [main, develop, 'qa/**']
  pull_request:
    branches: [main, develop, 'qa/**']
  workflow_dispatch:

# Cancel an in-flight run of the SAME ref when a newer commit lands.
concurrency:
  group: local-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-deploy:
    name: Build, Test, and Deploy
    runs-on: self-hosted

    steps:

      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Python ───────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sample_app/requirements.txt

      # ── Test (always) ────────────────────────────────────────────────────
      - name: Run unit tests
        run: |
          pytest sample_app/test_app.py

      # ── Build (always) ───────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f sample_app/Dockerfile \
            -t ai-devops-sample-app:${{ github.sha }} \
            -t ai-devops-sample-app:latest \
            --load \
            sample_app

      # ── Smoke test (always) ──────────────────────────────────────────────
      #
      # Host port 5001 → Container port 5000
      #
      # This does NOT interfere with the actual application:
      #
      # Live app:   5000:5000
      # Smoke test: 5001:5000
      #
      - name: Smoke-test the image
        run: |
          set -e

          SMOKE=smoke-${{ github.sha }}

          # Remove previous smoke container if it exists
          docker rm -f "$SMOKE" >/dev/null 2>&1 || true

          echo "Starting smoke-test container..."

          docker run -d \
            --name "$SMOKE" \
            -p 5001:5000 \
            ai-devops-sample-app:${{ github.sha }}

          ok=0

          echo "Waiting for application on port 5001..."

          for i in {1..15}; do

            if curl -fs http://127.0.0.1:5001 > /dev/null; then
              ok=1
              break
            fi

            # Check whether container exited
            if [ "$(docker inspect -f '{{.State.Running}}' "$SMOKE" 2>/dev/null)" != "true" ]; then
              echo "Smoke test: container exited early."
              echo "Likely runtime/CMD/application startup error."
              break
            fi

            echo "Smoke test: waiting for app... ($i/15)"
            sleep 2

          done

          if [ "$ok" != "1" ]; then

            echo "========================================"
            echo "        SMOKE TEST FAILED"
            echo "========================================"

            echo "----- Container status -----"
            docker ps -a --filter "name=$SMOKE"

            echo "----- Container logs -----"
            docker logs "$SMOKE" || true

            docker rm -f "$SMOKE" >/dev/null 2>&1 || true

            echo "Smoke test FAILED — image does not run correctly."

            exit 1
          fi

          echo "========================================"
          echo "        SMOKE TEST PASSED"
          echo "========================================"

          docker rm -f "$SMOKE" >/dev/null 2>&1 || true

      # ── Deploy (develop + push only) ─────────────────────────────────────
      #
      # Only develop push can deploy.
      #
      # Actual application:
      #
      # Host port 5000 → Container port 5000
      #
      - name: Stop existing container
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        run: |
          docker rm -f ai-devops-sample-app || true

      - name: Start container
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        run: |
          docker run -d \
            --name ai-devops-sample-app \
            -p 5000:5000 \
            --restart unless-stopped \
            ai-devops-sample-app:${{ github.sha }}

      # ── Health check actual application ──────────────────────────────────
      - name: Wait for app to be healthy
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        run: |
          echo "Waiting for application on port 5000..."

          for i in {1..20}; do

            if curl -fs http://127.0.0.1:5000 > /dev/null; then
              echo "Application is healthy!"
              exit 0
            fi

            echo "Not ready yet... retrying ($i/20)"
            sleep 3

          done

          echo "Application failed health check."

          echo "----- Container status -----"
          docker ps -a --filter "name=ai-devops-sample-app"

          echo "----- Application logs -----"
          docker logs ai-devops-sample-app

          exit 1

      # ── Verify deployment ────────────────────────────────────────────────
      - name: Verify deployment
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        run: |
          curl -f http://127.0.0.1:5000

      # ── Housekeeping ─────────────────────────────────────────────────────
      #
      # Remove dangling Docker images to prevent disk usage from growing.
      #
      - name: Prune dangling images
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        run: |
          docker image prune -f || true