name: Local CI/CD Deploy

# ── Git flow ────────────────────────────────────────────────────────────────
# build + test → every push/PR to main, develop, qa/**
# deploy        → push to main OR develop (same container, same :5000)
#
# Note: since both branches deploy to the same container/port, whichever one
# pushes LAST wins — a develop push after a main push will overwrite what's
# running, and vice versa. Fine for a single-box "test the latest build" setup.
on:
  push:
    branches: [main, develop, 'qa/**']
  pull_request:
    branches: [main, develop, 'qa/**']
  workflow_dispatch:

concurrency:
  group: local-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-deploy:
    name: Build, Test, and Deploy
    runs-on: self-hosted

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Python ───────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sample_app/requirements.txt

      # ── Test (always) ────────────────────────────────────────────────────
      - name: Run unit tests
        run: pytest sample_app/test_app.py

      # ── Build (always) ──────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f sample_app/Dockerfile \
            -t ai-devops-sample-app:${{ github.sha }} \
            -t ai-devops-sample-app:latest \
            --load \
            sample_app

      # ── Smoke test (always) ────────────────────────────────────────────────
      - name: Smoke-test the image
        run: |
          set -e
          SMOKE=smoke-${{ github.sha }}
          docker rm -f "$SMOKE" >/dev/null 2>&1 || true
          docker run -d --name "$SMOKE" -p 5000:5000 ai-devops-sample-app:${{ github.sha }}

          ok=0
          for i in {1..15}; do
            if curl -fs http://127.0.0.1:500 > /dev/null; then ok=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$SMOKE" 2>/dev/null)" != "true" ]; then
              echo "Smoke test: container exited early — likely a runtime/CMD error"
              break
            fi
            echo "Smoke test: waiting for app... ($i/15)"
            sleep 2
          done

          if [ "$ok" != "1" ]; then
            echo "----- container logs -----"
            docker logs "$SMOKE" || true
            docker rm -f "$SMOKE" >/dev/null 2>&1 || true
            echo "Smoke test FAILED — image does not run correctly"
            exit 1
          fi

          echo "Smoke test PASSED"
          docker rm -f "$SMOKE" >/dev/null 2>&1 || true

      # ── Deploy (main OR develop, push only) ────────────────────────────────
      - name: Stop existing container
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
        run: docker rm -f ai-devops-sample-app || true

      - name: Start container
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
        run: |
          docker run -d \
            --name ai-devops-sample-app \
            -p 5000:5000 \
            --restart unless-stopped \
            ai-devops-sample-app:${{ github.sha }}

      - name: Wait for app to be healthy
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
        run: |
          echo "Waiting for application to start..."
          for i in {1..20}; do
            if curl -fs http://127.0.0.1:5000 > /dev/null; then
              echo "Application is healthy!"
              exit 0
            fi
            echo "Not ready yet... retrying ($i/20)"
            sleep 3
          done
          echo "Application failed health check"
          docker logs ai-devops-sample-app
          exit 1

      - name: Verify deployment
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
        run: curl -f http://127.0.0.1:5000

      # ── Housekeeping ─────────────────────────────────────────────────────
      - name: Prune dangling images
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
        run: docker image prune -f || true