name: Local CI/CD Deploy

# ── Git flow ────────────────────────────────────────────────────────────────
# build + test  → runs on every push/PR to main & develop (and feature→develop PRs)
# deploy        → ONLY on push to main (the box has one app + one port 5000)
#
#   feature/* ──PR──► develop ──► release/* ──► main ──► (deploy)
#                       │            │            └─ deploy + tag
#                       └ build+test └ build+test (no deploy)
#
# Why split: building on every branch catches Dockerfile/test breakage BEFORE
# merge, but only main may bind :5000 and run a container — otherwise two
# branches racing on an 8GB single-box runner collide on the port and on RAM.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel an in-flight run of the SAME ref when a newer commit lands.
concurrency:
  group: local-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-deploy:
    name: Build, Test, and (main only) Deploy
    runs-on: self-hosted

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Python ───────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sample_app/requirements.txt

      # ── Test (always) ────────────────────────────────────────────────────
      - name: Run unit tests
        run: pytest sample_app/test_app.py

      # ── Build (always — validates the Dockerfile on every branch) ─────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f sample_app/Dockerfile \
            -t ai-devops-sample-app:${{ github.sha }} \
            -t ai-devops-sample-app:latest \
            --load \
            sample_app

      # ── Smoke test (always — catches runtime errors a build can't) ────────
      # `docker build` succeeds even with a broken CMD/ENTRYPOINT (e.g. a typo'd
      # app filename); the failure only shows when the container actually runs.
      # This starts the image on a throwaway name+port and checks the app comes
      # up, so runtime breakage surfaces on EVERY branch — not silently on a main
      # deploy. Uses port 5001 so it never collides with the live :5000 container.
      - name: Smoke-test the image
        run: |
          set -e
          SMOKE=smoke-${{ github.sha }}
          docker rm -f "$SMOKE" >/dev/null 2>&1 || true
          docker run -d --name "$SMOKE" -p 5001:5000 ai-devops-sample-app:${{ github.sha }}

          ok=0
          for i in {1..15}; do
            if curl -fs http://127.0.0.1:5001 > /dev/null; then ok=1; break; fi
            # Container exited already? bad CMD / crash-on-start — stop waiting.
            if [ "$(docker inspect -f '{{.State.Running}}' "$SMOKE" 2>/dev/null)" != "true" ]; then
              echo "Smoke test: container exited early — likely a runtime/CMD error"
              break
            fi
            echo "Smoke test: waiting for app... ($i/15)"
            sleep 2
          done

          if [ "$ok" != "1" ]; then
            echo "----- container logs -----"
            docker logs "$SMOKE" || true
            docker rm -f "$SMOKE" >/dev/null 2>&1 || true
            echo "Smoke test FAILED — image does not run correctly"
            exit 1
          fi

          echo "Smoke test PASSED"
          docker rm -f "$SMOKE" >/dev/null 2>&1 || true

      # ── Deploy (main + push only) ─────────────────────────────────────────
      # Every deploy step is gated so PRs and develop pushes stop after build.
      - name: Stop existing container
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker rm -f ai-devops-sample-app || true

      - name: Start container
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker run -d \
            --name ai-devops-sample-app \
            -p 5000:5000 \
            --restart unless-stopped \
            ai-devops-sample-app:${{ github.sha }}

      - name: Wait for app to be healthy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Waiting for application to start..."
          for i in {1..20}; do
            if curl -fs http://127.0.0.1:5000 > /dev/null; then
              echo "Application is healthy!"
              exit 0
            fi
            echo "Not ready yet... retrying ($i/20)"
            sleep 3
          done
          echo "Application failed health check"
          docker logs ai-devops-sample-app
          exit 1

      - name: Verify deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: curl -f http://127.0.0.1:5000

      # ── Housekeeping: drop old image tags so the 8GB box doesn't fill up ──
      - name: Prune dangling images
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker image prune -f || true
